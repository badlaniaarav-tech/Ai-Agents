name: Publish the office to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["office/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the static office (agents.json from the agent files)
        run: python3 office/build.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: office
      - id: deployment
        uses: actions/deploy-pages@v4
