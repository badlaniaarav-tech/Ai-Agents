<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Office</title>
<style>
  :root { --bg:#0e1116; --panel:#161b23; --line:#263040; --text:#e6edf3; --muted:#8b98a8; --accent:#ffd400; }
  * { box-sizing:border-box }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden }
  #scene { position:fixed; inset:0 }
  #top { position:fixed; top:0; left:0; right:0; display:flex; gap:16px; align-items:center; padding:10px 16px; background:linear-gradient(var(--bg), transparent); pointer-events:none }
  #top h1 { font-size:16px; margin:0; font-weight:600 }
  #top .pill { pointer-events:auto; padding:4px 10px; border:1px solid var(--line); border-radius:999px; background:var(--panel); color:var(--muted); font-size:12px }
  #top .pill b { color:var(--text) }
  #top .live::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:#5a6472; margin-right:6px }
  #top .live.on::before { background:#3fd27f; box-shadow:0 0 8px #3fd27f }
  #top button { pointer-events:auto; margin-left:auto; cursor:pointer; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; font-size:12px }
  #side { position:fixed; top:52px; right:12px; width:300px; max-height:calc(100% - 64px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px }
  #side h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px }
  .dept { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); cursor:pointer }
  .dept:last-child { border-bottom:0 }
  .sw { width:10px; height:10px; border-radius:3px; flex:none }
  .dept .n { flex:1 }
  .dept .c { color:var(--muted); font-size:12px }
  #card { display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--line) }
  #card .name { font-weight:600; font-size:15px }
  #card .role { color:var(--muted); font-size:12px; margin-bottom:8px }
  #card p { margin:6px 0 }
  #card .kv { font-size:12px; color:var(--muted); word-break:break-word }
  #log { position:fixed; left:12px; bottom:12px; width:340px; max-height:160px; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:12px; color:var(--muted) }
  #log div { padding:2px 0 }
  #log b { color:var(--text); font-weight:500 }
  #hint { position:fixed; left:12px; top:52px; font-size:12px; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px }
  @media (max-width:800px) { #side { width:min(300px, calc(100% - 24px)) } #log { width:calc(100% - 24px) } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="top">
  <h1>AI Office</h1>
  <span class="pill"><b id="count">0</b> agents + chief of staff · <b id="working">0</b> working</span>
  <span class="pill live" id="live">static</span>
  <button id="demo">Demo activity</button>
</div>
<div id="hint">drag to orbit · wheel to zoom · click a character</div>
<div id="side">
  <h2>Departments</h2>
  <div id="depts"></div>
  <div id="card">
    <div class="name"></div>
    <div class="role"></div>
    <p class="desc"></p>
    <div class="kv tools"></div>
    <div class="kv model"></div>
  </div>
</div>
<div id="log"><div>Waiting for events. Run <b>python3 office/serve.py</b> and open this page from it to see agents work live.</div></div>

<script src="vendor/three.min.js"></script>
<script>
(async function () {
  const COLORS = { Leadership:0xffd400, Creative:0xff6b6b, Marketing:0x4cc9f0, Sales:0x80ed99, Research:0xb388ff, Engineering:0xffa94d, Operations:0x74c0fc };
  const data = await fetch('agents.json').then(r => r.json()).catch(() => ({ departments: [] }));

  // ---------- scene ----------
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1116);
  scene.fog = new THREE.Fog(0x0e1116, 60, 120);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);

  scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a1f28, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(20, 40, 15); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50, far: 120 });
  scene.add(sun);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x151a22, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  // ---------- rooms ----------
  const ROOM_W = 14, ROOM_D = 10, GAP = 3;
  const depts = data.departments;
  const cols = Math.min(4, depts.length), rows = Math.ceil(depts.length / cols);
  const totalW = cols * ROOM_W + (cols - 1) * GAP, totalD = rows * ROOM_D + (rows - 1) * GAP;
  const agents = []; // {name, dept, mesh, home, working, ...}
  const byName = new Map();

  function label(text, color, size) {
    const c = document.createElement('canvas'); const ctx = c.getContext('2d');
    const px = size || 44; ctx.font = `600 ${px}px system-ui, sans-serif`;
    c.width = Math.ceil(ctx.measureText(text).width) + 40; c.height = px + 28;
    ctx.font = `600 ${px}px system-ui, sans-serif`;
    ctx.fillStyle = 'rgba(14,17,22,0.75)'; ctx.beginPath(); ctx.roundRect(0, 0, c.width, c.height, 14); ctx.fill();
    ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.fillText(text, 20, c.height / 2);
    const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    const s = 0.012 * (size ? size / 44 : 1); sp.scale.set(c.width * s, c.height * s, 1);
    return sp;
  }

  function desk(x, z, color) {
    const g = new THREE.Group();
    const top = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.9), new THREE.MeshStandardMaterial({ color: 0x3a3f4a, roughness: .7 }));
    top.position.y = 0.75; top.castShadow = true; g.add(top);
    for (const [dx, dz] of [[-.8, -.35], [.8, -.35], [-.8, .35], [.8, .35]]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(.08, .75, .08), new THREE.MeshStandardMaterial({ color: 0x23272f }));
      leg.position.set(dx, .375, dz); g.add(leg);
    }
    const screen = new THREE.Mesh(new THREE.BoxGeometry(.9, .55, .05), new THREE.MeshStandardMaterial({ color: 0x0b0d12, emissive: color, emissiveIntensity: .15 }));
    screen.position.set(0, 1.12, -.2); g.add(screen); g.userData.screen = screen;
    g.position.set(x, 0, z); return g;
  }

  function character(color, isHead) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color, roughness: .6 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(.28, .3, .62, 14), mat); body.position.y = .72; body.castShadow = true; g.add(body);
    const shoulders = new THREE.Mesh(new THREE.SphereGeometry(.28, 14, 10), mat); shoulders.position.y = 1.03; shoulders.castShadow = true; g.add(shoulders);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.26, 16, 16), new THREE.MeshStandardMaterial({ color: 0xf2d6c0, roughness: .8 })); head.position.y = 1.38; head.castShadow = true; g.add(head);
    const eye = new THREE.MeshStandardMaterial({ color: 0x111 });
    for (const dx of [-.09, .09]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.035, 8, 8), eye); e.position.set(dx, 1.42, .23); g.add(e); }
    if (isHead) { const hat = new THREE.Mesh(new THREE.CylinderGeometry(.2, .2, .18, 16), new THREE.MeshStandardMaterial({ color: 0x1c1f26 })); hat.position.y = 1.66; g.add(hat);
      const brim = new THREE.Mesh(new THREE.CylinderGeometry(.33, .33, .03, 16), hat.material); brim.position.y = 1.58; g.add(brim); }
    const ring = new THREE.Mesh(new THREE.RingGeometry(.45, .6, 32), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = .02; g.add(ring);
    const bubble = label('working…', '#ffd400', 36); bubble.position.y = 2.6; bubble.visible = false; g.add(bubble);
    g.userData = { body, head, ring, bubble };
    return g;
  }

  depts.forEach((d, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = -totalW / 2 + ROOM_W / 2 + col * (ROOM_W + GAP);
    const cz = -totalD / 2 + ROOM_D / 2 + row * (ROOM_D + GAP);
    const color = COLORS[d.name] || 0x9aa4b2;
    const floor = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, .2, ROOM_D), new THREE.MeshStandardMaterial({ color: 0x1f2630, roughness: .9 }));
    floor.position.set(cx, .1, cz); floor.receiveShadow = true; scene.add(floor);
    const trim = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, .22, .25), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .35 }));
    trim.position.set(cx, .1, cz - ROOM_D / 2 + .12); scene.add(trim);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a3240, transparent: true, opacity: .55, roughness: 1 });
    const back = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 2.4, .15), wallMat); back.position.set(cx, 1.4, cz - ROOM_D / 2); back.castShadow = true; scene.add(back);
    const left = new THREE.Mesh(new THREE.BoxGeometry(.15, 2.4, ROOM_D), wallMat); left.position.set(cx - ROOM_W / 2, 1.4, cz); scene.add(left);
    const sign = label(d.name.toUpperCase(), '#' + color.toString(16).padStart(6, '0'), 56); sign.position.set(cx, 3.4, cz - ROOM_D / 2); scene.add(sign);
    const plant = new THREE.Mesh(new THREE.ConeGeometry(.45, 1.2, 7), new THREE.MeshStandardMaterial({ color: 0x3f9b5a, roughness: 1 })); plant.position.set(cx + ROOM_W / 2 - .9, .8, cz + ROOM_D / 2 - .9); plant.castShadow = true; scene.add(plant);

    const n = d.agents.length, perRow = Math.min(4, n), deskRows = Math.ceil(n / perRow);
    d.agents.forEach((a, j) => {
      const r = Math.floor(j / perRow), c = j % perRow, inRow = Math.min(perRow, n - r * perRow);
      const x = cx - (inRow - 1) * 1.6 + c * 3.2, z = cz - ROOM_D / 2 + 2.2 + r * 3.6;
      const dk = desk(x, z, color); scene.add(dk);
      const ch = character(color, a.role === 'head'); ch.position.set(x, 0, z + .95); scene.add(ch);
      const tag = label(a.name, '#e6edf3', 34); tag.position.y = 1.95; ch.add(tag);
      const rec = { ...a, dept: d.name, color, mesh: ch, desk: dk, home: new THREE.Vector3(x, 0, z + .95), lobby: new THREE.Vector3(x + (Math.random() - .5) * 3, 0, cz + ROOM_D / 2 + 1.5 + Math.random() * 1.5), working: false, phase: Math.random() * 6, idleT: Math.random() * 10 };
      ch.traverse(o => { o.userData.agent = rec; });
      agents.push(rec); byName.set(a.name, rec);
    });
  });

  // ---------- camera orbit ----------
  const target = new THREE.Vector3(0, 0, 2);
  let yaw = 0.6, pitch = 0.85, dist = Math.max(totalW, totalD) * 0.95;
  function placeCamera() {
    camera.position.set(target.x + dist * Math.sin(yaw) * Math.cos(pitch), target.y + dist * Math.sin(pitch), target.z + dist * Math.cos(yaw) * Math.cos(pitch));
    camera.lookAt(target);
  }
  let drag = null, moved = 0;
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, b: e.button }; moved = 0; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
    if (drag.b === 2 || e.shiftKey) { const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)); const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)); target.addScaledVector(right, -dx * dist * 0.0015).addScaledVector(fwd, -dy * dist * 0.0015); }
    else { yaw -= dx * 0.005; pitch = Math.min(1.45, Math.max(0.15, pitch + dy * 0.005)); }
  });
  canvas.addEventListener('pointerup', e => { if (drag && moved < 6) pick(e); drag = null; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => { dist = Math.min(140, Math.max(12, dist * (1 + Math.sign(e.deltaY) * 0.08))); e.preventDefault(); }, { passive: false });
  let touchD = 0;
  canvas.addEventListener('touchmove', e => { if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (touchD) dist = Math.min(140, Math.max(12, dist * touchD / d)); touchD = d; } }, { passive: true });
  canvas.addEventListener('touchend', () => { touchD = 0; });

  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  function pick(e) {
    ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(agents.map(a => a.mesh), true).find(h => h.object.userData.agent);
    if (hit) showCard(hit.object.userData.agent);
  }

  // ---------- side panel ----------
  const deptsEl = document.getElementById('depts'), card = document.getElementById('card');
  depts.forEach((d, i) => {
    const row = document.createElement('div'); row.className = 'dept';
    row.innerHTML = `<span class="sw" style="background:#${(COLORS[d.name] || 0x9aa4b2).toString(16).padStart(6, '0')}"></span><span class="n">${d.name}</span><span class="c" data-dept="${d.name}">${d.agents.length}</span>`;
    row.onclick = () => { const col = i % cols, rowi = Math.floor(i / cols); target.set(-totalW / 2 + ROOM_W / 2 + col * (ROOM_W + GAP), 0, -totalD / 2 + ROOM_D / 2 + rowi * (ROOM_D + GAP)); dist = 22; };
    deptsEl.appendChild(row);
  });
  function showCard(a) {
    card.style.display = 'block';
    card.querySelector('.name').textContent = a.name;
    card.querySelector('.role').textContent = `${a.dept} · ${a.role === 'head' ? 'department head' : 'worker'} · ${a.working ? 'working' : 'idle'}`;
    card.querySelector('.desc').textContent = a.description;
    card.querySelector('.tools').textContent = 'tools: ' + a.tools;
    card.querySelector('.model').textContent = 'model: ' + a.model;
  }
  document.getElementById('count').textContent = agents.filter(a => a.name !== 'chief-of-staff').length;

  // ---------- status ----------
  const logEl = document.getElementById('log');
  function log(msg) { const d = document.createElement('div'); d.innerHTML = msg; logEl.prepend(d); while (logEl.children.length > 40) logEl.lastChild.remove(); }
  function setWorking(name, on, why) {
    const a = byName.get(name); if (!a) return;
    if (a.working !== on) log(`<b>${name}</b> ${on ? 'started' : 'finished'}${why ? ' · ' + why : ''}`);
    a.working = on; a.mesh.userData.bubble.visible = on;
    document.getElementById('working').textContent = agents.filter(x => x.working).length;
  }
  function handle(ev) {
    const t = ev.event || '';
    if (t === 'UserPromptSubmit') { setWorking('chief-of-staff', true, 'new request'); }
    else if (t === 'SubagentStart') { setWorking(ev.agent, true); }
    else if (t === 'SubagentStop') { setWorking(ev.agent, false); }
    else if (t === 'Stop') { agents.forEach(a => setWorking(a.name, false)); }
  }
  let since = 0, live = false, demo = null;
  async function poll() {
    try {
      const r = await fetch(`/events?since=${since}`, { cache: 'no-store' }); if (!r.ok) throw 0;
      const j = await r.json(); if (!live) { live = true; document.getElementById('live').textContent = 'live'; document.getElementById('live').classList.add('on'); }
      if (since === 0 && j.total > 200) since = j.total - 200; // don't replay a long history
      j.events.slice(Math.max(0, since - (j.total - j.events.length))).forEach(handle); since = j.total;
    } catch (e) { /* opened as a file or no server: stay static */ }
    setTimeout(poll, 1500);
  }
  poll();
  document.getElementById('demo').onclick = function () {
    if (demo) { clearInterval(demo); demo = null; this.textContent = 'Demo activity'; agents.forEach(a => setWorking(a.name, false)); return; }
    this.textContent = 'Stop demo'; setWorking('chief-of-staff', true, 'demo');
    demo = setInterval(() => { const a = agents[Math.floor(Math.random() * agents.length)]; setWorking(a.name, !a.working, 'demo'); }, 900);
  };

  // ---------- animate ----------
  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  const clock = new THREE.Clock();
  function frame() {
    const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
    for (const a of agents) {
      const u = a.mesh.userData;
      const goal = a.working ? a.home : (a.wander || a.home);
      // idle agents occasionally stroll to the lobby of their room and back
      a.idleT -= dt; if (!a.working && a.idleT < 0) { a.idleT = 6 + Math.random() * 10; a.wander = a.wander ? null : a.lobby; }
      const d = goal.clone().sub(a.mesh.position); d.y = 0; const len = d.length();
      if (len > .05) { a.mesh.position.addScaledVector(d.normalize(), Math.min(len, 2.2 * dt)); a.mesh.rotation.y = Math.atan2(d.x, d.z); u.body.position.y = .72 + Math.abs(Math.sin(t * 9 + a.phase)) * .06; }
      else { a.mesh.rotation.y += (0 - a.mesh.rotation.y) * .1; u.body.position.y = .72 + Math.sin(t * 2 + a.phase) * .015; }
      if (a.working) { u.head.position.y = 1.38 + Math.sin(t * 7 + a.phase) * .04; u.ring.material.opacity = .45 + Math.sin(t * 4 + a.phase) * .3; u.ring.scale.setScalar(1 + Math.sin(t * 4 + a.phase) * .08); a.desk.userData.screen.material.emissiveIntensity = .9; }
      else { u.head.position.y = 1.38; u.ring.material.opacity += (0 - u.ring.material.opacity) * .1; a.desk.userData.screen.material.emissiveIntensity += (.15 - a.desk.userData.screen.material.emissiveIntensity) * .1; }
    }
    placeCamera(); renderer.render(scene, camera); requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
